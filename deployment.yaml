
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-forecasting-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-forecasting-system
  template:
    metadata:
      labels:
        app: weather-forecasting-system
    spec:
      containers:
        - name: weather-forecasting-system
          image: somesh2404/weather-forecasting-system:1.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: weather-forecasting-system
spec:
  type: NodePort
  selector:
    app: weather-forecasting-system
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008
